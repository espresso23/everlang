services:
  # Disposable test SMTP only; not an application runtime service.
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025"]
  nest-qa-api:
    image: everlang-api:local
    environment:
      DATABASE_URL: postgresql://everlang:${POSTGRES_PASSWORD}@postgres:5432/everlang_nest_qa_20261101
      REDIS_URL: redis://redis:6379/15
      PUBLIC_ORIGIN: http://localhost:3002
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64}
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64}
      CSRF_SECRET: ${CSRF_SECRET}
      ADMIN_EMAILS: nest-admin@example.test,knowledge-admin@example.test,catalogue-qa-admin@example.test,everlang-qa-a@example.test
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SPEECH_PROVIDER: disabled
      SPEECH_MEDIA_ROOT: /data/speech-media
    volumes: [nest_qa_media:/data/speech-media]
  nest-qa-worker:
    image: everlang-worker:local
    environment:
      DATABASE_URL: postgresql://everlang:${POSTGRES_PASSWORD}@postgres:5432/everlang_nest_qa_20261101
      REDIS_URL: redis://redis:6379/15
      SERVICE_NAME: everlang-grading-worker-qa
  nest-qa-web:
    image: everlang-web:local
    environment: {PORT: 3001, HOSTNAME: 0.0.0.0}
  nest-qa-gateway:
    image: caddy:2-alpine
    ports: ["127.0.0.1:3002:8080"]
    volumes: ["./tests/integration/NestQaGatewayfile:/etc/caddy/Caddyfile:ro"]
volumes:
  nest_qa_media:
