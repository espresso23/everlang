x-app-env: &app-env
  DATABASE_URL: postgresql://everlang:${POSTGRES_PASSWORD}@postgres:5432/everlang
  MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/korean_practice}
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3.8-flash}
  KRDICT_API_KEY: ${KRDICT_API_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-EverLang <hello@everlang.local>}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
  GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: everlang
      POSTGRES_DB: everlang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U everlang -d everlang"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 12
  mailpit:
    image: axllent/mailpit:latest
    profiles: [local]
    ports: ["127.0.0.1:8025:8025"]
    restart: unless-stopped
  migrate:
    build: {context: ., target: worker}
    environment: *app-env
    command: [npm, run, db:migrate]
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    build: {context: ., target: worker}
    environment: *app-env
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  app:
    build: {context: ., target: runner}
    ports: ["127.0.0.1:3000:3000"]
    environment: *app-env
    restart: unless-stopped
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "5"}
  caddy:
    image: caddy:2-alpine
    profiles: [production]
    ports: ["80:80", "443:443"]
    environment: {EVERLANG_DOMAIN: "${EVERLANG_DOMAIN:-localhost}"}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [app]
    restart: unless-stopped
volumes:
  mongo_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
